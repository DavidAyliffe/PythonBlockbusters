<!-- login.html - User login page.
     Displays a centered login form with username and password fields.
     Links to the registration page for new customers.
-->
{% extends "base.html" %}
{% block title %}Login - Blockbusters{% endblock %}
{% block content_noauth %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 col-lg-4">
        <!-- App branding -->
        <div class="text-center mb-4">
            <div class="fs-1">🎬</div>
            <h2 class="mt-2">Blockbusters</h2>
            <p class="text-secondary">🔐 Sign in to your account</p>
        </div>
        <!-- Login form card -->
        <div class="card">
            <div class="card-body p-4">
                <form method="POST">
                    <!-- Username input -->
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" name="username" class="form-control" required autofocus>
                    </div>
                    <!-- Password input -->
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Sign In</button>
                </form>
            </div>
        </div>
        <!-- Link to registration page -->
        <p class="text-center mt-3">
            <a href="{{ url_for('auth.register') }}">Create a customer account</a>
        </p>
    </div>
</div>
{% endblock %}
